[project]
name = "rae-mcp-shell"
version = "0.3.1"
description = "MCP server: run allowlisted read-only shell commands inside the workspace"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.2,<3",
]

[project.scripts]
rae-mcp-shell = "rae_mcp_shell.server:main"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rae_mcp_shell"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
