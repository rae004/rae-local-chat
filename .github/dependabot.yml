version: 2
updates:
  # Python deps via uv (reads the workspace pyproject.toml files + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "python"

  # Frontend deps via pnpm.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom"]
    ignore:
      # @types/node tracks the Node runtime major, which is pinned to 24 LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Base images in the Dockerfiles.
  - package-ecosystem: "docker"
    directories: ["/api", "/frontend"]
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Runtime majors are locked decisions (CLAUDE.md): Node 24 LTS, Python 3.14.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Pin + bump GitHub Actions used in workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
