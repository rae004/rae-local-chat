services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://chat:chat@postgres:5432/chat
      OLLAMA_BASE_URL: http://workhorse:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:latest}
    extra_hosts:
      - "workhorse:${WORKHORSE_IP:-192.168.68.65}"
    volumes:
      - ./api/src:/app/api/src
      - ./db/src:/app/db/src
      - ./db/migrations:/app/db/migrations
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
